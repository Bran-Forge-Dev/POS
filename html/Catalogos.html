<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="../css/catalogos.css" rel="stylesheet" />
<link href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script>requerirSesion();</script>
<title>NeoVenta - Catálogos</title>
</head>
<body>
        <header class="encabezado">
            <!-- Botón regresar -->
            <a href="menu.html" class="btn-regresar">
                <i class="las la-arrow-left"></i>
            </a>

            <!-- Logo centrado -->
            <div class="logo">NeoVenta</div>
        </header>

        <!-- Título principal -->
        <h2 class="titulo">Catálogos</h2>

        <main class="catalogos-container">
            <!-- Tarjeta Usuarios -->
            <div class="card">
                <div class="icon-circle">
                    <i class="las la-user fa-2x"></i>
                </div>
                <p>Vista de los usuarios</p>
                <a href="ControlUsuarios.html" class="btn-card">Usuarios</a>
            </div>

            <!-- Tarjeta Productos -->
            <div class="card">
                <div class="icon-circle">
                    <i class="las la-shopping-cart fa-2x"></i>
                </div>
                <p>Dar alta/baja/editar productos<br/>Visualización de productos</p>
                <a href="productos.html" class="btn-card">Productos</a>
            </div>

            <!-- Tarjeta Proveedor -->
            <div class="card">
                <div class="icon-circle">
                    <i class="las la-truck fa-2x"></i>
                </div>
                <p>Dar alta/baja/editar proveedores<br/>Visualización de proveedores</p>
                <a href="proveedores.html" class="btn-card">Proveedor</a>
            </div>
        </main>
</body>
</html>
