<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>NeoVenta - Agregar Usuario</title>
    <link href="../css/agregar-usuario.css" rel="stylesheet" />
    <link href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>requerirRol("admin");</script>
</head>
<body>
    <!-- ENCABEZADO -->
    <header class="encabezado">
        <a href="ControlUsuarios.html" class="btn-regresar">
            <i class="las la-arrow-left"></i>
        </a>
        <h1 class="logo">NeoVenta</h1>
    </header>

    <!-- TÍTULO -->
    <h2 class="titulo">Agregar Usuario</h2>

    <!-- FORMULARIO -->
    <div class="form-contenedor">
        <form id="formUsuario">
            <div class="fila">
                <label>Cuenta</label>
                <input type="text" id="cuenta" />
            </div>
            <div class="fila">
                <label>Clave</label>
                <input type="password" id="clave" />
            </div>
            <div class="fila">
                <label>Rol</label>
                <select id="rol">
                    <option value="cajero">Cajero</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <div class="fila-doble">
                <div class="sub-fila">
                    <label>Teléfono</label>
                    <input type="text" id="telefono" />
                </div>
                <div class="sub-fila">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" id="fecha" placeholder="dd/mm/aaaa" />
                </div>
            </div>
            <div class="fila">
                <label>Correo</label>
                <input type="email" id="correo" />
            </div>
        </form>
    </div>

    <!-- BOTONES -->
    <div class="botones">
        <button type="button" class="btn-guardar" onclick="guardarUsuario(event)">Guardar</button>
        <button class="btn-cancelar" onclick="window.location.href='ControlUsuarios.html'">Cancelar</button>
    </div>

    <script src="../js/agregarusuario.js"></script>
</body>
</html>
