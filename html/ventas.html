<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="../css/ventas.css" rel="stylesheet" />
<link href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/ticket.js"></script>
<script>requerirSesion();</script>
<script src="../js/ventas.js" defer></script>
<title>NeoVenta - Ventas</title>
</head>
<body>
  <header class="encabezado">
    <a href="menu.html" class="btn-regresar">
      <i class="las la-arrow-left"></i>
    </a>
    <h1 class="titulo">NeoVenta</h1>
  </header>

  <main class="panel">

    <section class="bloque">
      <h2 class="subtitulo">Corte de caja</h2>
      <div class="corte-card" id="corteEstado"></div>
      <div class="corte-acciones">
        <a href="PuntodeVenta.html" class="btn-card">
          <i class="las la-shopping-cart"></i> Punto de Venta
        </a>
        <button id="btnAbrir" class="btn-card">
          <i class="las la-lock-open"></i> Abrir corte
        </button>
        <button id="btnCerrar" class="btn-card">
          <i class="las la-lock"></i> Cerrar corte
        </button>
      </div>
    </section>

    <section class="bloque">
      <h2 class="subtitulo">Ventas de hoy<span id="totalHoy"></span></h2>
      <div class="tabla-contenedor">
        <table class="tabla">
          <thead>
            <tr>
              <th>Folio</th>
              <th>Hora</th>
              <th>Cajero</th>
              <th>Total</th>
              <th>Pago</th>
              <th>Cambio</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbodyVentas"></tbody>
        </table>
      </div>
    </section>

    <section class="bloque">
      <h2 class="subtitulo">Productos más vendidos</h2>
      <div class="reporte-filtros">
        <label>Desde <input type="date" id="repDesde"></label>
        <label>Hasta <input type="date" id="repHasta"></label>
        <button id="btnReporte" class="btn-card" type="button">Generar</button>
      </div>
      <div class="tabla-contenedor">
        <table class="tabla">
          <thead>
            <tr>
              <th>#</th>
              <th>Código</th>
              <th>Producto</th>
              <th>Unidades</th>
              <th>Importe</th>
            </tr>
          </thead>
          <tbody id="tbodyReporte"></tbody>
        </table>
      </div>
    </section>

    <section class="bloque">
      <h2 class="subtitulo">Historial de cortes</h2>
      <div class="tabla-contenedor">
        <table class="tabla">
          <thead>
            <tr>
              <th>Apertura</th>
              <th>Cajero</th>
              <th>Cierre</th>
              <th>Estado</th>
              <th>Fondo</th>
              <th>Ventas</th>
              <th>Total</th>
              <th>Contado</th>
              <th>Diferencia</th>
            </tr>
          </thead>
          <tbody id="tbodyCortes"></tbody>
        </table>
      </div>
    </section>

  </main>
</body>
</html>
